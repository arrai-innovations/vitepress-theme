version: 2.1

orbs:
    pnpm: arrai/pnpm@2.0.0

jobs:
    check:
        executor: pnpm/lts
        steps:
            - checkout
            - pnpm/install_pnpm
            - restore_cache:
                  keys:
                      - pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - run:
                  name: Install dependencies
                  command: pnpm install --frozen-lockfile
            - save_cache:
                  paths:
                      - ~/.local/share/pnpm/store
                  key: pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - run:
                  name: Check package and downstream fixtures
                  command: pnpm check

workflows:
    test:
        jobs:
            - check
